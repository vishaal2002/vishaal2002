<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Experience and education. Software Engineer at Workhall, Coimbatore, since January 2023. B.E. Mechatronics Engineering, Thiagarajar College of Engineering, 2019 to 2023, CGPA 9.42 of 10, department rank holder. Certifications: Oracle Multicloud Architect 2025, Oracle Generative AI Professional 2025, Azure AZ-900 2025, AWS Cloud Practitioner 2024, Google Data Analytics 2021.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="624" height="344" rx="24"/></clipPath>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.8">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="640" height="360" fill="#0F0F16"/>
    <rect width="640" height="360" fill="url(#glow)"/>
  </g>
  <rect x="8.5" y="8.5" width="623" height="343" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="36" y="52" class="mono" font-size="12" letter-spacing="1.5" fill="#8B8B95">EXPERIENCE · EDUCATION</text>

  <!-- timeline -->
  <path d="M46 84V176" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="46" cy="84" r="10" fill="#34D399" opacity="0.2" class="pulse"/>
  <circle cx="46" cy="84" r="5" fill="#34D399"/>
  <text x="68" y="78" class="mono" font-size="12" fill="#8B8B95">JAN 2023 – NOW</text>
  <text x="68" y="100" class="sans" font-size="19" font-weight="700" fill="#FFFFFF">Software Engineer · Workhall</text>
  <text x="68" y="122" class="sans" font-size="14" fill="#A1A1AA">Features → systems → architecture → ownership</text>

  <circle cx="46" cy="166" r="5" fill="#0F0F16" stroke="#A1A1AA" stroke-width="2"/>
  <text x="68" y="160" class="mono" font-size="12" fill="#8B8B95">2019 – 2023</text>
  <text x="68" y="182" class="sans" font-size="19" font-weight="700" fill="#FFFFFF">B.E. Mechatronics Engineering</text>
  <text x="68" y="204" class="sans" font-size="14" fill="#A1A1AA">Thiagarajar College of Engineering, Madurai</text>

  <g transform="translate(468 150)">
    <rect width="136" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="68" y="34" class="sans" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">9.42<tspan font-size="14" font-weight="600" fill="#8B8B95"> / 10</tspan></text>
    <text x="68" y="54" class="sans" font-size="12" fill="#A1A1AA" text-anchor="middle">CGPA · rank holder</text>
  </g>

  <path d="M36 236H604" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="36" y="262" class="mono" font-size="12" letter-spacing="1.5" fill="#8B8B95">CERTIFIED</text>
  <g class="sans" font-size="13" fill="#E4E4E7" text-anchor="middle">
    <rect x="36" y="276" width="184" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="128" y="295.5">Oracle Multicloud Architect</text>
    <rect x="228" y="276" width="174" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="315" y="295.5">Oracle Gen AI Professional</text>
    <rect x="410" y="276" width="114" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="467" y="295.5">Azure AZ-900</text>
    <rect x="36" y="314" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="124" y="333.5">AWS Cloud Practitioner</text>
    <rect x="220" y="314" width="164" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="302" y="333.5">Google Data Analytics</text>
  </g>
</svg>
