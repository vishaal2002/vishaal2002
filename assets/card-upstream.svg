<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t">
  <title id="t">21 merged pull requests in other open-source projects, including OpenTelemetry eBPF profiler, rocketmq-rust, the React Native Directory, pyvm-updater, monetra and am-neuralnetwork.</title>
  <defs>
