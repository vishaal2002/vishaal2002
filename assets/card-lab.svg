<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">On the bench, side projects in progress. Kalibr: a 90-second daily perception calibration app, React Native with Skia and Reanimated, in development. Bloom: a privacy-first cycle tracker with all processing on-device, React Native and Expo, in final development. Nook: a desktop break companion, Tauri 2 and React, early build.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="624" height="344" rx="24"/></clipPath>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.8">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A5F3FC"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="blo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBCFE8"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
    <linearGradient id="noo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .breathe{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
    @keyframes breathe{50%{transform:scale(.82)}}
    .blur{animation:blur 3s ease-in-out infinite alternate}
    @keyframes blur{to{opacity:.35}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="640" height="360" fill="#0F0F16"/>
    <rect width="640" height="360" fill="url(#glow)"/>
  </g>
  <rect x="8.5" y="8.5" width="623" height="343" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="36" y="52" class="mono" font-size="12" letter-spacing="1.5" fill="#8B8B95">ON THE BENCH</text>
  <text x="604" y="52" class="sans" font-size="13" fill="#8B8B95" text-anchor="end">side projects in progress</text>

  <!-- Kalibr -->
  <g transform="translate(36 76)">
    <rect width="568" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="14" y="14" width="48" height="48" rx="12" fill="url(#kal)"/>
    <circle class="blur" cx="38" cy="38" r="11" fill="#FFFFFF" filter="url(#soft)"/>
    <text x="78" y="34" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">Kalibr</text>
    <text x="78" y="56" class="sans" font-size="13" fill="#A1A1AA">90-second daily perception calibration · RN, Skia</text>
    <rect x="420" y="23" width="134" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="438" cy="38" r="4" fill="#A1A1AA"/>
    <text x="450" y="42.5" class="sans" font-size="12.5" fill="#D4D4D8">in development</text>
  </g>

  <!-- Bloom -->
  <g transform="translate(36 164)">
    <rect width="568" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="14" y="14" width="48" height="48" rx="12" fill="url(#blo)"/>
    <g fill="#FFFFFF" fill-opacity="0.9">
      <ellipse cx="38" cy="30" rx="5" ry="8"/><ellipse cx="38" cy="46" rx="5" ry="8"/>
      <ellipse cx="30" cy="38" rx="8" ry="5"/><ellipse cx="46" cy="38" rx="8" ry="5"/>
    </g>
    <circle cx="38" cy="38" r="4" fill="#DB2777"/>
    <text x="78" y="34" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">Bloom</text>
    <text x="78" y="56" class="sans" font-size="13" fill="#A1A1AA">Privacy-first cycle tracker, on-device only · RN, Expo</text>
    <rect x="420" y="23" width="134" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="438" cy="38" r="4" fill="#A1A1AA"/>
    <text x="450" y="42.5" class="sans" font-size="12.5" fill="#D4D4D8">final stretch</text>
  </g>

  <!-- Nook -->
  <g transform="translate(36 252)">
    <rect width="568" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="14" y="14" width="48" height="48" rx="12" fill="url(#noo)"/>
    <circle class="breathe" cx="38" cy="38" r="12" fill="#FFFFFF" fill-opacity="0.9"/>
    <text x="78" y="34" class="sans" font-size="17" font-weight="700" fill="#FFFFFF">Nook</text>
    <text x="78" y="56" class="sans" font-size="13" fill="#A1A1AA">Desktop companion for real breaks · Tauri 2, React</text>
    <rect x="420" y="23" width="134" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="438" cy="38" r="4" fill="#A1A1AA"/>
    <text x="450" y="42.5" class="sans" font-size="12.5" fill="#D4D4D8">early build</text>
  </g>
</svg>
