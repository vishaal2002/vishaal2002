<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t">
  <title id="t">Vishaal Karthik B. Software Engineer, Mobile at Workhall. I build the systems under React Native apps. 14.8K npm downloads, 52 stars on my packages, 21 merged upstream PRs, 3.5+ years of production React Native.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="1264" height="544" rx="28"/></clipPath>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1880" height="1160"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="vignette" cx="0.32" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#0A0A0F" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .b1{animation:d1 16s ease-in-out infinite alternate}
    .b2{animation:d2 20s ease-in-out infinite alternate}
    .b3{animation:d3 24s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(-160px,70px)}}
    @keyframes d2{to{transform:translate(-220px,-60px)}}
    @keyframes d3{to{transform:translate(140px,-90px)}}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="560" fill="#0A0A0F"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="980" cy="150" r="210" fill="#7C3AED" opacity="0.9"/>
      <circle class="b2" cx="1180" cy="430" r="180" fill="#0891B2" opacity="0.85"/>
      <circle class="b3" cx="760" cy="500" r="150" fill="#EA580C" opacity="0.55"/>
    </g>
    <rect width="1280" height="560" fill="url(#grid)"/>
    <rect width="1280" height="560" fill="url(#vignette)"/>
  </g>
  <rect x="8.5" y="8.5" width="1263" height="543" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- status pill -->
  <g>
    <rect x="72" y="64" width="372" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle class="pulse" cx="94" cy="83" r="5" fill="#34D399"/>
    <circle cx="94" cy="83" r="9" fill="#34D399" opacity="0.18"/>
    <text x="112" y="88.5" class="sans" font-size="15" fill="#D4D4D8">Software Engineer, Mobile · Workhall</text>
  </g>

  <!-- name + tagline -->
  <text class="sans" x="66" y="208" font-size="90" font-weight="800" letter-spacing="-3" fill="url(#name)">Vishaal Karthik</text>
  <g>
    <text x="72" y="264" class="sans" font-size="29" font-weight="500" fill="#F4F4F5">I build the systems under React Native apps:</text>
    <text x="72" y="304" class="sans" font-size="29" font-weight="500" fill="#A1A1AA">registries, gesture engines, release pipelines.</text>
  </g>

  <!-- stat tiles -->
  <g>
    <g transform="translate(72 362)">
      <rect width="252" height="112" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <rect x="22" y="22" width="26" height="4" rx="2" fill="#A78BFA"/>
      <text x="22" y="72" class="sans" font-size="40" font-weight="700" fill="#FFFFFF">14.8K</text>
      <text x="22" y="96" class="sans" font-size="14" fill="#A1A1AA">npm downloads</text>
    </g>
    <g transform="translate(340 362)">
      <rect width="252" height="112" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <rect x="22" y="22" width="26" height="4" rx="2" fill="#22D3EE"/>
      <text x="22" y="72" class="sans" font-size="40" font-weight="700" fill="#FFFFFF">52 ★</text>
      <text x="22" y="96" class="sans" font-size="14" fill="#A1A1AA">across my React Native packages</text>
    </g>
    <g transform="translate(608 362)">
      <rect width="252" height="112" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <rect x="22" y="22" width="26" height="4" rx="2" fill="#F472B6"/>
      <text x="22" y="72" class="sans" font-size="40" font-weight="700" fill="#FFFFFF">21</text>
      <text x="22" y="96" class="sans" font-size="14" fill="#A1A1AA">merged PRs in other projects</text>
    </g>
    <g transform="translate(876 362)">
      <rect width="252" height="112" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <rect x="22" y="22" width="26" height="4" rx="2" fill="#FB923C"/>
      <text x="22" y="72" class="sans" font-size="40" font-weight="700" fill="#FFFFFF">3.5+ yrs</text>
      <text x="22" y="96" class="sans" font-size="14" fill="#A1A1AA">production React Native</text>
    </g>
  </g>

  <text x="72" y="520" class="mono" font-size="13" fill="#71717A">Coimbatore, India</text>
  <text x="1208" y="520" class="mono" font-size="13" fill="#71717A" text-anchor="end">React Native · TypeScript · iOS · Android</text>
</svg>
