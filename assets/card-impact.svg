<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t">
  <title id="t">In production at Workhall since January 2023: files per new component 3 to 1 with a ComponentRegistry (67 files migrated); same-day hotfixes with a Stallion OTA pipeline; 16+ VAPT findings remediated; 200+ Dependabot alerts resolved; ESLint issues 2,000+ to 0; zero incidents across the React Native 0.77 to 0.86 and New Architecture migration; about 400 field users a day on the location field; a 24-unit web grid translated to an 8-unit mobile grid.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="1264" height="424" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13111F"/>
      <stop offset="1" stop-color="#0D1218"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FED7AA"/><stop offset="1" stop-color="#FB923C"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBCFE8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BBF7D0"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .n{font-size:46px;font-weight:800;letter-spacing:-1.4px}
    .l{font-size:16px;font-weight:600;fill:#F4F4F5}
    .s{font-size:13px;fill:#8B8B95}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
  </g>
  <rect x="8.5" y="8.5" width="1263" height="423" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="48" y="60" class="mono" font-size="13" letter-spacing="1.5" fill="#E4E4E7">IN PRODUCTION AT WORKHALL · SINCE JAN 2023</text>
  <text x="1232" y="60" class="mono" font-size="12" fill="#8B8B95" text-anchor="end">case studies at vishaalkarthik.com ↗</text>

  <g stroke="#FFFFFF" stroke-opacity="0.08">
    <path d="M336 96V220M632 96V220M928 96V220M336 262V386M632 262V386M928 262V386M48 241H1232"/>
  </g>

  <g class="sans">
    <text x="48" y="146" class="n" fill="url(#g1)">3 → 1</text>
    <text x="48" y="180" class="l">files per new component</text>
    <text x="48" y="204" class="s">ComponentRegistry · 67 files migrated</text>

    <text x="364" y="146" class="n" fill="url(#g2)">Same day</text>
    <text x="364" y="180" class="l">hotfixes, down from days</text>
    <text x="364" y="204" class="s">Stallion OTA for JS-only fixes</text>

    <text x="660" y="146" class="n" fill="url(#g3)">16+</text>
    <text x="660" y="180" class="l">VAPT findings remediated</text>
    <text x="660" y="204" class="s">OWASP Mobile Top 10 · MobSF</text>

    <text x="956" y="146" class="n" fill="url(#g4)">200+</text>
    <text x="956" y="180" class="l">Dependabot alerts resolved</text>
    <text x="956" y="204" class="s">shipped inside normal delivery</text>

    <text x="48" y="312" class="n" fill="url(#g4)">2,000 → 0</text>
    <text x="48" y="346" class="l">ESLint issues</text>
    <text x="48" y="370" class="s">and led the SonarQube cleanup</text>

    <text x="364" y="312" class="n" fill="url(#g5)">0</text>
    <text x="364" y="346" class="l">incidents, RN 0.77 → 0.86</text>
    <text x="364" y="370" class="s">New Architecture, in verified hops</text>

    <text x="660" y="312" class="n" fill="url(#g2)">≈400</text>
    <text x="660" y="346" class="l">field users a day</text>
    <text x="660" y="370" class="s">location field in dynamic forms</text>

    <text x="956" y="312" class="n" fill="url(#g1)">24 → 8</text>
    <text x="956" y="346" class="l">web grid to mobile grid</text>
    <text x="956" y="370" class="s">Mobile Grid &amp; Canvas system</text>
  </g>
</svg>
