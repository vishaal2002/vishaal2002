<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t">
  <title id="t">In production at Workhall: files touched per new component cut from 3 to 1 with a ComponentRegistry; same-day hotfixes, down from days, with an OTA pipeline; 12+ OWASP Mobile Top 10 findings closed after a pen test; ESLint issues cut from 2,000+ to 0.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="1264" height="284" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13111F"/>
      <stop offset="1" stop-color="#0D1218"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FED7AA"/><stop offset="1" stop-color="#FB923C"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBCFE8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#grid)"/>
  </g>
  <rect x="8.5" y="8.5" width="1263" height="283" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="48" y="60" class="mono" font-size="13" letter-spacing="1.5" fill="#E4E4E7">IN PRODUCTION AT WORKHALL</text>
  <text x="1232" y="60" class="mono" font-size="12" fill="#71717A" text-anchor="end">private codebase · measured internally</text>

  <g stroke="#FFFFFF" stroke-opacity="0.08">
    <path d="M336 100V250M632 100V250M928 100V250"/>
  </g>

  <g>
    <text x="48" y="160" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#g1)">3 → 1</text>
    <text x="48" y="198" class="sans" font-size="17" font-weight="600" fill="#F4F4F5">files per new component</text>
    <text x="48" y="224" class="sans" font-size="14" fill="#71717A">self-registering ComponentRegistry</text>
  </g>
  <g>
    <text x="364" y="160" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#g2)">Same day</text>
    <text x="364" y="198" class="sans" font-size="17" font-weight="600" fill="#F4F4F5">hotfixes, down from days</text>
    <text x="364" y="224" class="sans" font-size="14" fill="#71717A">OTA pipeline for JS-only fixes</text>
  </g>
  <g>
    <text x="660" y="160" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#g3)">12+</text>
    <text x="660" y="198" class="sans" font-size="17" font-weight="600" fill="#F4F4F5">OWASP Mobile Top 10 fixes</text>
    <text x="660" y="224" class="sans" font-size="14" fill="#71717A">after a third-party pen test</text>
  </g>
  <g>
    <text x="956" y="160" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#g4)">2,000 → 0</text>
    <text x="956" y="198" class="sans" font-size="17" font-weight="600" fill="#F4F4F5">ESLint issues</text>
    <text x="956" y="224" class="sans" font-size="14" fill="#71717A">and led the SonarQube cleanup</text>
  </g>
</svg>
