<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t">
  <title id="t">react-native-board-view: Kanban and swimlane boards for React Native and Expo. 29 stars, 1.6K npm downloads, janky frames cut from 42% to 0.4%.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="744" height="424" rx="24"/></clipPath>
    <radialGradient id="glow" cx="0.92" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .drag{transform-box:fill-box;transform-origin:center;animation:drag 5.5s cubic-bezier(.45,.05,.3,1) infinite}
    @keyframes drag{
      0%,10%{transform:translate(0,0) rotate(0);opacity:1}
      20%{transform:translate(6px,-12px) rotate(-3deg)}
      52%{transform:translate(234px,-12px) rotate(-3deg)}
      62%,86%{transform:translate(228px,0) rotate(0);opacity:1}
      91%{transform:translate(228px,0);opacity:0}
      95%{transform:translate(0,0);opacity:0}
      100%{transform:translate(0,0);opacity:1}}
    .ph{animation:ph 5.5s linear infinite}
    @keyframes ph{0%,24%{opacity:0}32%,60%{opacity:1}63%,100%{opacity:0}}
    .finger{animation:finger 5.5s linear infinite}
    @keyframes finger{0%,12%{opacity:0}18%,56%{opacity:1}62%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="760" height="440" fill="#0F0F16"/>
    <rect width="760" height="440" fill="url(#glow)"/>
  </g>
  <rect x="8.5" y="8.5" width="743" height="423" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="40" y="56" class="mono" font-size="13" letter-spacing="1.5" fill="#A78BFA">FLAGSHIP · OPEN SOURCE</text>
  <text x="712" y="58" class="sans" font-size="22" fill="#71717A" text-anchor="end">↗</text>
  <text x="40" y="100" class="sans" font-size="34" font-weight="700" letter-spacing="-0.8" fill="#FFFFFF">react-native-board-view</text>
  <text x="40" y="132" class="sans" font-size="17" fill="#A1A1AA">Kanban and swimlane boards for React Native and Expo</text>

  <!-- column headers -->
  <g class="sans" font-size="13" font-weight="600" fill="#D4D4D8">
    <circle cx="48" cy="178" r="4" fill="#94A3B8"/><text x="60" y="182.5">To do</text>
    <circle cx="276" cy="178" r="4" fill="#60A5FA"/><text x="288" y="182.5">In progress</text>
    <circle cx="504" cy="178" r="4" fill="#34D399"/><text x="516" y="182.5">Done</text>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.025">
    <rect x="34" y="194" width="228" height="144" rx="12"/>
    <rect x="264" y="194" width="226" height="144" rx="12"/>
    <rect x="492" y="194" width="226" height="144" rx="12"/>
  </g>

  <!-- static cards -->
  <g id="cards">
    <g transform="translate(40 204)"><rect width="216" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="12" y="11" width="30" height="5" rx="2.5" fill="#F472B6"/><rect x="12" y="21" width="150" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/></g>
    <g transform="translate(40 248)"><rect width="216" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="12" y="11" width="30" height="5" rx="2.5" fill="#FBBF24"/><rect x="12" y="21" width="118" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/></g>
    <g transform="translate(268 204)"><rect width="216" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="12" y="11" width="30" height="5" rx="2.5" fill="#60A5FA"/><rect x="12" y="21" width="164" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/></g>
    <g transform="translate(268 248)"><rect width="216" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="12" y="11" width="30" height="5" rx="2.5" fill="#F472B6"/><rect x="12" y="21" width="104" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/></g>
    <g transform="translate(496 204)"><rect width="216" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="12" y="11" width="30" height="5" rx="2.5" fill="#34D399"/><rect x="12" y="21" width="140" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/></g>
    <g transform="translate(496 248)"><rect width="216" height="36" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/><rect x="12" y="11" width="30" height="5" rx="2.5" fill="#34D399"/><rect x="12" y="21" width="96" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/></g>
  </g>

  <!-- placeholder gap -->
  <rect class="ph" x="268" y="292" width="216" height="36" rx="9" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.7" stroke-dasharray="5 4"/>

  <!-- the card being dragged -->
  <g class="drag">
    <g transform="translate(40 292)" filter="url(#shadow)">
      <rect width="216" height="36" rx="9" fill="#1C1A2E" stroke="#A78BFA" stroke-width="1.5"/>
      <rect x="12" y="11" width="30" height="5" rx="2.5" fill="#A78BFA"/>
      <rect x="12" y="21" width="132" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.45"/>
      <g class="finger">
        <circle cx="186" cy="24" r="13" fill="#FFFFFF" fill-opacity="0.16"/>
        <circle cx="186" cy="24" r="6" fill="#FFFFFF" fill-opacity="0.55"/>
      </g>
    </g>
  </g>

  <!-- chips -->
  <g class="sans" font-size="14" fill="#E4E4E7" text-anchor="middle">
    <rect x="40" y="368" width="70" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="75" y="390">★ 29</text>
    <rect x="120" y="368" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="195" y="390">1.6K downloads</text>
    <rect x="280" y="368" width="190" height="34" rx="17" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="375" y="390" fill="#DDD6FE">jank 42% → 0.4%</text>
    <rect x="480" y="368" width="176" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="568" y="390">New Architecture</text>
  </g>
</svg>
