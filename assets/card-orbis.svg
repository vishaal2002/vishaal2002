<svg xmlns="http://www.w3.org/2000/svg" width="427" height="380" viewBox="0 0 427 380" role="img" aria-labelledby="t">
  <title id="t">Orbis: an interactive 3D globe with 14 lenses and no backend, built with Three.js and a custom GLSL day/night shader. Live app.</title>
  <defs>
    <clipPath id="clip"><rect x="8" y="8" width="411" height="364" rx="24"/></clipPath>
    <clipPath id="globe"><circle cx="213" cy="222" r="72"/></clipPath>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.8">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sea" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.48" stop-color="#05060A" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#05060A" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .lights{animation:tw 3s ease-in-out infinite alternate}
    @keyframes tw{to{opacity:.4}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="427" height="380" fill="#0F0F16"/>
    <rect width="427" height="380" fill="url(#glow)"/>
    <g fill="#FFFFFF">
      <circle cx="60" cy="160" r="1" opacity=".5"/><circle cx="110" cy="290" r="1" opacity=".4"/>
      <circle cx="350" cy="250" r="1.2" opacity=".5"/><circle cx="380" cy="160" r="1" opacity=".35"/>
      <circle cx="320" cy="300" r="1" opacity=".4"/><circle cx="80" cy="220" r="1.2" opacity=".3"/>
    </g>
  </g>
  <rect x="8.5" y="8.5" width="410" height="363" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="36" y="52" class="mono" font-size="12" letter-spacing="1.5" fill="#60A5FA">WEBGL · LIVE</text>
  <text x="391" y="54" class="sans" font-size="20" fill="#71717A" text-anchor="end">↗</text>
  <text x="36" y="92" class="sans" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">Orbis</text>
  <text x="36" y="120" class="sans" font-size="15" fill="#A1A1AA">A 3D globe with 14 lenses, no backend</text>

  <!-- back half of the orbit -->
  <ellipse cx="213" cy="222" rx="128" ry="30" transform="rotate(-16 213 222)" fill="none" stroke="#93C5FD" stroke-opacity="0.25" stroke-dasharray="3 5"/>

  <circle cx="213" cy="222" r="90" fill="url(#atmo)"/>
  <circle cx="213" cy="222" r="72" fill="url(#sea)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#BFDBFE" stroke-opacity="0.28" stroke-width="1">
    <path d="M141 222H285M145 197H281M161 172H265M145 247H281M161 272H265"/>
    <ellipse cx="213" cy="222" rx="72" ry="72"><animate attributeName="rx" values="72;0;72" dur="8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="213" cy="222" rx="36" ry="72"><animate attributeName="rx" values="54;0;72;54" keyTimes="0;0.25;0.75;1" dur="8s" begin="-1s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="213" cy="222" rx="10" ry="72"><animate attributeName="rx" values="36;0;72;36" keyTimes="0;0.33;0.83;1" dur="8s" begin="-2s" repeatCount="indefinite"/></ellipse>
    <path d="M213 150V294"/>
    <!-- continents, abstract -->
    <g fill="#34D399" fill-opacity="0.55" stroke="none">
      <path d="M170 186c10-8 28-6 34 2 4 6-2 14-10 16-6 2-8 10-16 10-10 0-16-10-14-18 1-4 3-7 6-10z"/>
      <path d="M214 228c8-4 20 0 22 8 2 10-6 22-14 26-6 3-10-4-10-12 0-8-6-16 2-22z"/>
      <path d="M240 178c8-2 18 2 22 8 2 4-4 8-10 8-8 0-16-2-18-8 0-4 2-7 6-8z"/>
    </g>
  </g>
  <circle cx="213" cy="222" r="72" fill="url(#night)"/>
  <g class="lights" fill="#FDE68A">
    <circle cx="252" cy="200" r="1.4"/><circle cx="262" cy="214" r="1.2"/><circle cx="248" cy="238" r="1.4"/>
    <circle cx="270" cy="232" r="1.1"/><circle cx="258" cy="252" r="1.3"/><circle cx="240" cy="196" r="1"/>
  </g>

  <!-- front of the orbit + the ISS -->
  <g transform="rotate(-16 213 222)">
    <path d="M85 222A128 30 0 0 0 341 222" fill="none" stroke="#93C5FD" stroke-opacity="0.6" stroke-width="1.3"/>
    <circle r="4" fill="#FFFFFF">
      <animateMotion dur="9s" repeatCount="indefinite" path="M85 222a128 30 0 1 0 256 0a128 30 0 1 0 -256 0"/>
    </circle>
  </g>

  <g class="sans" font-size="14" fill="#E4E4E7" text-anchor="middle">
    <rect x="36" y="320" width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="82" y="342">Three.js</text>
    <rect x="138" y="320" width="120" height="34" rx="17" fill="#60A5FA" fill-opacity="0.13" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="198" y="342" fill="#DBEAFE">GLSL shader</text>
    <rect x="268" y="320" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="316" y="342">Live ISS</text>
  </g>
</svg>
